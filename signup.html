<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#050505;
  font-family:Arial, sans-serif;
  color:white;
}
.box{
  width:360px;
  background:#0f0f0f;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 25px #00ffee55;
}
h2{text-align:center;color:#00ffee;}
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  border:1px solid #333;
  color:white;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.signup{
  background:#00ffee;
  color:black;
}
.google{
  background:white;
  color:black;
  box-shadow:0 0 15px #4285f4;
}
small{
  display:block;
  margin-top:10px;
  text-align:center;
}
a{color:#00ffee;text-decoration:none;}
</style>
</head>

<body>

<div class="box">
  <h2>Create Account</h2>

  <input id="username" placeholder="Username">
  <input id="phone" placeholder="Phone number">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (min 6 chars)">

  <button class="signup" id="signupBtn">SIGN UP</button>
  <button class="google" id="googleBtn">Sign up with Google</button>

  <small>Already have account? <a href="login.html">Login</a></small>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, setDoc }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

document.getElementById("signupBtn").addEventListener("click", async () => {
  try {
    if(password.value.length < 6){
      alert("Password must be at least 6 characters");
      return;
    }

    const res = await createUserWithEmailAndPassword(
      auth, email.value, password.value
    );

    await setDoc(doc(db,"users",res.user.uid),{
      username: username.value,
      phone: phone.value,
      email: email.value,
      provider: "email",
      createdAt: Date.now()
    });

    alert("Signup successful");
    location.href="index.html";
  } catch(err){
    alert(err.message);
    console.error(err);
  }
});

document.getElementById("googleBtn").addEventListener("click", async () => {
  try{
    const provider = new GoogleAuthProvider();
    const res = await signInWithPopup(auth, provider);

    await setDoc(doc(db,"users",res.user.uid),{
      username: res.user.displayName,
      phone: "",
      email: res.user.email,
      provider: "google",
      createdAt: Date.now()
    },{merge:true});

    location.href="index.html";
  }catch(err){
    alert(err.message);
    console.error(err);
  }
});
</script>

</body>
</html>
