<meta charset="UTF-8">
<title>Sign Up - Digital Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050505;
    font-family: 'Arial', sans-serif;
    color: white;
  }

  .signup-box {
    width: 380px;
    background: #0a0a0a;
    padding: 40px 30px;
    border-radius: 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 0 40px rgba(0, 255, 238, 0.3);
    border: 1px solid #1f1f1f;
  }

  .glow-border {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 3px;
    background: linear-gradient(45deg, #00ffee, #00ff88, #00ffee);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    pointer-events: none;
    animation: border-glow 4s linear infinite;
  }

  @keyframes border-glow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  h2 {
    font-size: 28px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00ffee, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
  }

  .subtitle {
    font-size: 16px;
    color: #aaa;
    margin-bottom: 30px;
  }

  .input-group {
    margin: 15px 0;
  }

  input {
    width: 100%;
    padding: 16px;
    background: #111;
    border: 1px solid #333;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
    box-sizing: border-box;
  }

  input:focus {
    border-color: #00ffee;
    box-shadow: 0 0 20px rgba(0, 255, 238, 0.4);
  }

  input::placeholder {
    color: #777;
  }

  button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
  }

  .signup {
    background: linear-gradient(90deg, #00ffee, #00ff88);
    color: black;
  }

  .signup:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 255, 238, 0.5);
  }

  .google {
    background: white;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .google img {
    width: 20px;
    height: 20px;
  }

  .google:hover {
    box-shadow: 0 10px 30px rgba(66, 133, 244, 0.4);
    transform: translateY(-3px);
  }

  small {
    display: block;
    margin-top: 25px;
    font-size: 14px;
    color: #aaa;
  }

  small a {
    color: #00ffee;
    text-decoration: none;
    font-weight: bold;
  }

  small a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .signup-box {
      width: 90%;
      padding: 35px 25px;
    }
    h2 {
      font-size: 26px;
    }
  }
</style>
</head>

<body>

<div class="signup-box">
  <div class="glow-border"></div>
  <h2>Create Account in Digital Cart</h2>
  <p class="subtitle">Welcome Next Millionaire!</p>

  <div class="input-group">
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="input-group">
    <input type="tel" id="phone" placeholder="Phone number">
  </div>

  <div class="input-group">
    <input type="email" id="email" placeholder="Email">
  </div>

  <div class="input-group">
    <!-- Password permanent visible (text type) -->
    <input type="text" id="password" placeholder="Password (min 6 chars)">
  </div>

  <button class="signup" id="signupBtn">SIGN UP</button>
  <button class="google" id="googleBtn">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G">
    Sign up with Google
  </button>

  <small>Already have account? <a href="login.html">Login</a></small>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { 
  createUserWithEmailAndPassword, 
  GoogleAuthProvider, 
  signInWithPopup   // POPUP MODE for app compatibility
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Email/Password Signup
document.getElementById("signupBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !email || !password) {
    alert("Please fill all required fields");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  try {
    const res = await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", res.user.uid), {
      username: username,
      phone: phone,
      email: email,
      provider: "email",
      createdAt: Date.now()
    });

    alert("Signup successful!");
    location.href = "index.html";
  } catch (err) {
    alert("Signup failed: " + err.message);
    console.error(err);
  }
});

// Google Signup - POPUP MODE (fixes blank screen in app)
document.getElementById("googleBtn").addEventListener("click", async () => {
  const provider = new GoogleAuthProvider();

  try {
    // POPUP MODE - works perfectly in WebView/Custom Tabs
    const res = await signInWithPopup(auth, provider);

    // Save or update user data in Firestore
    await setDoc(doc(db, "users", res.user.uid), {
      username: res.user.displayName || "Google User",
      phone: res.user.phoneNumber || "",
      email: res.user.email,
      photoURL: res.user.photoURL || "",
      provider: "google",
      createdAt: Date.now()
    }, { merge: true });

    alert("Google Signup successful!");
    location.href = "index.html";
  } catch (err) {
    if (err.code === 'auth/popup-blocked') {
      alert("Popup blocked! Please allow popups and try again.");
    } else if (err.code === 'auth/cancelled-popup-request') {
      // User closed popup - ignore
    } else {
      alert("Google Signup failed: " + err.message);
    }
    console.error(err);
  }
});
</script>

</body>
</html>
