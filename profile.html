<script>
function toggleMenu(){
  const menu = document.getElementById("menuBox");
  if(menu){
    menu.classList.toggle("show");
  }
}
</script>
<body>

<!-- HEADER -->
<header class="main-top-bar">
  <div class="logo-box">
    <img src="logo.png" class="site-logo">
    <span class="logo-text">DIGITAL CART</span>
  </div>

  <div class="menu">
    <button class="menu-icon" onclick="toggleMenu()">☰</button>

    <div class="dropdown" id="menuBox">
      <a href="index.html">🏠 Home</a>
      <a href="profile.html">👤 Profile</a>
      <a href="your-products.html">📦 Your Products</a>
      <a href="transaction-history.html">💳 Transactions</a>
      <a href="#" id="logoutBtn">🚪 Logout</a>
    </div>
  </div>
</header>

<!-- PROFILE CARD -->
<div class="page-center">
  <div class="profile-card">

    <img src="logo.png" class="profile-avatar">

    <h2 id="displayName">User</h2>

    <label>Name</label>
    <input id="nameInput" placeholder="Your name">

    <label>Email (cannot be changed)</label>
    <input id="emailInput" disabled>

    <label>Phone Number</label>
    <input id="phoneInput" placeholder="Phone number">

    <button id="saveBtn">SAVE CHANGES</button>

    <p class="profile-note">
      Email change disabled for security reasons.
    </p>

  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, getDoc, setDoc } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const nameInput = document.getElementById("nameInput");
const emailInput = document.getElementById("emailInput");
const phoneInput = document.getElementById("phoneInput");
const displayName = document.getElementById("displayName");

let uid = null;

onAuthStateChanged(auth, async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  uid = user.uid;
  emailInput.value = user.email;

  const ref = doc(db,"users",uid);
  const snap = await getDoc(ref);

  if(snap.exists()){
    const u = snap.data();
    nameInput.value = u.username || "";
    phoneInput.value = u.phone || "";
    displayName.innerText = u.username || "User";
  }else{
    // create user doc if not exists
    await setDoc(ref,{
      username: "",
      phone: "",
      email: user.email,
      createdAt: Date.now()
    });
  }
});

document.getElementById("saveBtn").onclick = async ()=>{
  if(!uid) return;

  await setDoc(
    doc(db,"users",uid),
    {
      username: nameInput.value,
      phone: phoneInput.value,
      email: emailInput.value,
      updatedAt: Date.now()
    },
    { merge:true }
  );

  displayName.innerText = nameInput.value || "User";
  alert("Profile updated successfully");
};
</script>
