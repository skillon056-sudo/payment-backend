<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Transactions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .admin-container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #00ffee, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 36px;
    }

    .tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .tab {
      padding: 12px 30px;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .tab.active {
      background: linear-gradient(90deg, #00ffee, #00ff88);
      color: #000;
      font-weight: bold;
    }

    .tab:hover {
      box-shadow: 0 0 20px rgba(0, 255, 238, 0.3);
    }

    .bulk-actions {
      margin: 20px 0;
      text-align: right;
    }

    .bulk-delete-btn {
      background: #ff4444;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      display: none;
    }

    .bulk-delete-btn:hover {
      background: #ff0000;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #1f1f1f;
    }

    th {
      background: #1a1a1a;
      color: #00ffee;
    }

    tr:hover {
      background: #151515;
    }

    .status-paid { color: #00ff88; font-weight: bold; }
    .status-failed { color: #ff6b6b; font-weight: bold; }
    .status-pending { color: #ffff00; font-weight: bold; }

    .delete-btn {
      background: #ff4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #ff0000;
    }

    .no-data {
      text-align: center;
      padding: 40px;
      color: #777;
      font-size: 18px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="admin-container">
  <h1>Admin - Transactions</h1>

  <div class="tabs">
    <div class="tab active" data-tab="all">All Orders</div>
    <div class="tab" data-tab="failed">Failed Orders</div>
  </div>

  <div class="bulk-actions">
    <button id="bulkDeleteBtn" class="bulk-delete-btn">Delete Selected</button>
  </div>

  <table id="ordersTable">
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll"></th>
        <th>Order ID</th>
        <th>User ID</th>
        <th>Product ID</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="ordersBody">
      <tr><td colspan="8" class="no-data">Loading transactions...</td></tr>
    </tbody>
  </table>
</div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  getDocs,
  doc,
  deleteDoc,
  orderBy,
  query
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const ordersBody = document.getElementById("ordersBody");
const selectAllCheckbox = document.getElementById("selectAll");
const bulkDeleteBtn = document.getElementById("bulkDeleteBtn");

let allOrders = [];
let currentFilter = "all";

async function loadOrders(filter = "all") {
  currentFilter = filter;
  ordersBody.innerHTML = `<tr><td colspan="8" class="no-data">Loading...</td></tr>`;
  selectAllCheckbox.checked = false;
  bulkDeleteBtn.style.display = "none";

  try {
    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    const snapshot = await getDocs(q);
    allOrders = [];

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      data.id = docSnap.id;
      allOrders.push(data);
    });

    renderOrders(filter);
  } catch (err) {
    ordersBody.innerHTML = `<tr><td colspan="8" class="no-data">Error loading data</td></tr>`;
    console.error(err);
  }
}

function renderOrders(filter) {
  let filtered = allOrders;

  if (filter === "failed") {
    filtered = allOrders.filter(o => o.status === "failed" || o.status === "pending");
  }

  if (filtered.length === 0) {
    ordersBody.innerHTML = `<tr><td colspan="8" class="no-data">No orders found</td></tr>`;
    return;
  }

  ordersBody.innerHTML = filtered.map(order => {
    const date = order.createdAt ? new Date(order.createdAt.toDate()).toLocaleString() : "N/A";
    const statusClass = order.status === "paid" ? "status-paid" : 
                       (order.status === "failed" ? "status-failed" : "status-pending");

    return `
      <tr>
        <td><input type="checkbox" class="order-checkbox" data-id="${order.id}"></td>
        <td>${order.orderId}</td>
        <td>${order.userId}</td>
        <td>${order.productId}</td>
        <td>₹${order.amount}</td>
        <td class="${statusClass}">${order.status.toUpperCase()}</td>
        <td>${date}</td>
        <td>
          <button class="delete-btn" onclick="deleteOrder('${order.id}')">Delete</button>
        </td>
      </tr>
    `;
  }).join("");

  // Select All logic
  selectAllCheckbox.onchange = () => {
    document.querySelectorAll(".order-checkbox").forEach(cb => {
      cb.checked = selectAllCheckbox.checked;
    });
    updateBulkDeleteButton();
  };

  // Individual checkbox
  document.querySelectorAll(".order-checkbox").forEach(cb => {
    cb.onchange = updateBulkDeleteButton;
  });
}

function updateBulkDeleteButton() {
  const checked = document.querySelectorAll(".order-checkbox:checked").length;
  bulkDeleteBtn.style.display = checked > 0 ? "inline-block" : "none";
}

// Bulk Delete
bulkDeleteBtn.onclick = async () => {
  if (!confirm("Are you sure you want to delete all selected orders?")) return;

  const checkedBoxes = document.querySelectorAll(".order-checkbox:checked");
  const orderIds = Array.from(checkedBoxes).map(cb => cb.dataset.id);

  try {
    for (const id of orderIds) {
      await deleteDoc(doc(db, "orders", id));
    }
    alert(`Deleted ${orderIds.length} orders successfully!`);
    loadOrders(currentFilter);
  } catch (err) {
    alert("Error deleting orders");
    console.error(err);
  }
};

// Single delete
window.deleteOrder = async (orderId) => {
  if (!confirm("Delete this order?")) return;

  try {
    await deleteDoc(doc(db, "orders", orderId));
    alert("Order deleted!");
    loadOrders(currentFilter);
  } catch (err) {
    alert("Error deleting order");
  }
};

// Tab switching
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    loadOrders(tab.dataset.tab);
  });
});

// Initial load
loadOrders("all");
</script>

</body>
</html>
