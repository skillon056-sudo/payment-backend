<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin – Users</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <img src="../logo.png">
    <span>DIGITAL WORLD</span>
  </div>
  <a href="index.html">📊 Dashboard</a>
  <a href="products.html">📦 Products</a>
  <a href="users.html" class="active">👤 Users</a>
  <a href="transactions.html">💳 Transactions</a>
</div>

<div class="main">
  <div class="topbar">
    <div class="title">Users</div>
    <div class="admin">Admin Panel</div>
  </div>

  <div class="content">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
        </tr>
      </thead>
      <tbody id="userList"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { checkAdmin, getAllUsers } from "./admin.js";
await checkAdmin();

const users = await getAllUsers();
const list = document.getElementById("userList");

users.forEach(u=>{
  list.innerHTML += `
    <tr>
      <td>${u.username || "-"}</td>
      <td>${u.email}</td>
      <td>${u.phone || "-"}</td>
    </tr>
  `;
});
</script>

</body>
</html>
