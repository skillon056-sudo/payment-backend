<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin – Products</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <img src="../logo.png">
    <span>DIGITAL WORLD</span>
  </div>
  <a href="index.html">📊 Dashboard</a>
  <a href="products.html" class="active">📦 Products</a>
  <a href="users.html">👤 Users</a>
  <a href="transactions.html">💳 Transactions</a>
</div>

<div class="main">
  <div class="topbar">
    <div class="title">Products</div>
    <a href="add-product.html" class="add-btn">+ Add Product</a>
  </div>

  <div class="content">
    <table class="table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productList"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { db } from "../firebase.js";
import {
  collection, getDocs, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const list = document.getElementById("productList");
const snap = await getDocs(collection(db,"products"));

if(snap.empty){
  list.innerHTML = `<tr><td colspan="4">No products found</td></tr>`;
}

snap.forEach(d=>{
  const p = d.data();
  list.innerHTML += `
    <tr>
      <td>${p.title}</td>
      <td>₹${p.price}</td>
      <td>${p.disabled ? "Disabled" : "Active"}</td>
      <td>
        <button onclick="editProduct('${d.id}')">Edit</button>
        <button onclick="deleteProduct('${d.id}')">Delete</button>
      </td>
    </tr>
  `;
});

window.editProduct = id =>{
  location.href = `edit-product.html?id=${id}`;
};

window.deleteProduct = async id =>{
  if(confirm("Delete this product?")){
    await deleteDoc(doc(db,"products",id));
    location.reload();
  }
};
</script>

</body>
</html>
