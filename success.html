<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Success</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #00ffee;
      opacity: 0.8;
      animation: confetti-fall linear infinite;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .success-container {
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0, 255, 238, 0.3);
      position: relative;
      z-index: 10;
    }

    .success-icon {
      font-size: 100px;
      margin-bottom: 20px;
      color: #00ffee;
      text-shadow: 0 0 20px #00ffee;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 36px;
      margin: 20px 0;
      background: linear-gradient(90deg, #00ffee, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }

    p {
      font-size: 18px;
      margin: 15px 0;
      color: #ccc;
    }

    #statusText {
      font-size: 18px;
      margin: 30px 0;
      min-height: 28px;
      color: #00ff88;
      font-weight: bold;
    }

    #downloadBtn {
      background: linear-gradient(90deg, #00ffee, #00ff88);
      color: #000;
      border: none;
      padding: 18px 60px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0, 255, 238, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: none;
    }

    #downloadBtn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 255, 238, 0.6);
    }

    .glow-border {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 3px;
      background: linear-gradient(45deg, #00ffee, #00ff88, #00ffee);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      pointer-events: none;
      animation: border-glow 3s linear infinite;
    }

    @keyframes border-glow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
  </style>
</head>

<body>

<div class="success-container">
  <div class="glow-border"></div>
  <div class="success-icon">🎮✅</div>
  <h1>Thank You Gamer!</h1>
  <p>Your payment is being processed...</p>
  <p id="statusText">Checking payment status...</p>

  <button id="downloadBtn">DOWNLOAD NOW</button>
</div>

<script>
  // Confetti
  function launchConfetti() {
    const colors = ['#00ffee', '#00ff88', '#ff00ff', '#ffff00', '#00ffff'];
    for (let i = 0; i = 120; i++) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = Math.random() * 3 + 's';
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 6000);
    }
  }
  launchConfetti();
</script>

<script type="module">
import { db, auth } from "./firebase.js";
import {
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const ZAPUPI_TOKEN = "d6a35a8e8f49bafd82ba29f01589225a";
const ZAPUPI_SECRET = "8f6d1397dcf23599c528228554d79692";

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");
const orderId = params.get("order");

const statusText = document.getElementById("statusText");
const downloadBtn = document.getElementById("downloadBtn");

if (!productId || !orderId) {
  statusText.innerText = "Invalid payment session";
} else {
  statusText.innerText = "Checking payment status with gateway...";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  if (!orderId) {
    statusText.innerText = "No order ID found";
    return;
  }

  try {
    // ZapUPI Order Status API call
    const formData = new FormData();
    formData.append("token_key", ZAPUPI_TOKEN);
    formData.append("secret_key", ZAPUPI_SECRET);
    formData.append("order_id", orderId);

    const response = await fetch("https://api.zapupi.com/api/order-status", {
      method: "POST",
      body: formData
    });

    const result = await response.json();
    console.log("ZapUPI Status Response:", result);

    if (result.status === "success" && result.data?.status === "success") {
      // SUCCESS → Firebase में "paid" mark + download show
      const orderRef = doc(db, "orders", orderId);
      await updateDoc(orderRef, {
        status: "paid",
        paidAt: serverTimestamp(),
        txnId: result.data.txn_id || "unknown"
      });

      await showDownload();
    } else {
      // FAILED or PENDING → Firebase में "failed" mark + no download
      const orderRef = doc(db, "orders", orderId);
      await updateDoc(orderRef, {
        status: "failed",
        failedAt: serverTimestamp()
      });

      statusText.innerText = "Payment failed or pending. Contact support.";
    }

  } catch (err) {
    console.error("Status check error:", err);
    statusText.innerText = "Unable to check payment status. Contact support.";
  }

  async function showDownload() {
    try {
      const productSnap = await getDoc(doc(db, "products", productId));
      if (productSnap.exists()) {
        const product = productSnap.data();
        statusText.innerText = "Payment successful! Your game is ready 🎮";
        downloadBtn.style.display = "block";
        downloadBtn.onclick = () => {
          window.location.href = product.fileUrl;
        };
      } else {
        statusText.innerText = "Product not found";
      }
    } catch (e) {
      statusText.innerText = "Error loading product";
    }
  }
});
</script>

</body>
</html>
