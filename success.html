<meta charset="UTF-8">
<title>Payment Success</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .success-container {
    background: #0f0f0f;
    border: 1px solid #1f1f1f;
    border-radius: 20px;
    padding: 60px 40px;
    text-align: center;
    max-width: 520px;
    width: 90%;
    box-shadow: 0 0 40px rgba(0, 255, 238, 0.3);
    position: relative;
    z-index: 10;
  }

  .success-icon {
    font-size: 80px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .controller {
    font-size: 80px;
  }

  .check {
    background: #00ff88;
    width: 80px;
    height: 80px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    box-shadow: 0 0 30px #00ff88;
  }

  h1 {
    font-size: 40px;
    margin: 20px 0;
    background: linear-gradient(90deg, #00ffee, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
    letter-spacing: 1px;
  }

  p {
    font-size: 18px;
    margin: 15px 0;
    color: #ccc;
  }

  #statusText {
    font-size: 20px;
    margin: 30px 0;
    min-height: 30px;
    color: #00ff88;
    font-weight: bold;
  }

  #downloadBtn {
    background: linear-gradient(90deg, #00ffee, #00ff88);
    color: #000;
    border: none;
    padding: 20px 70px;
    font-size: 22px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 30px;
    box-shadow: 0 15px 40px rgba(0, 255, 238, 0.5);
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
    display: none;
  }

  #downloadBtn:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(0, 255, 238, 0.7);
  }

  .glow-border {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 4px;
    background: linear-gradient(45deg, #00ffee, #00ff88, #00ffee);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    pointer-events: none;
    animation: border-glow 4s linear infinite;
  }

  @keyframes border-glow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }
</style>
</head>

<body>

<div class="success-container">
  <div class="glow-border"></div>
  <div class="success-icon">
    <span class="controller">🎮</span>
    <div class="check">✓</div>
  </div>
  <h1>Thank You Gamer!</h1>
  <p>Your payment is being processed...</p>
  <p id="statusText">Verifying payment status...</p>

  <button id="downloadBtn">DOWNLOAD NOW</button>
</div>

<script type="module">
import { db, auth } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Meta Pixel base code (head में add किया था, लेकिन success page पर भी safe)
if (typeof fbq === 'function') {
  fbq('track', 'PageView');
}

const params = new URLSearchParams(window.location.search);
const orderId = params.get("order");

const statusText = document.getElementById("statusText");
const downloadBtn = document.getElementById("downloadBtn");

if (!orderId) {
  statusText.innerText = "Invalid payment link";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  let attempts = 0;
  const maxAttempts = 20;
  const delay = 3000;

  const checkStatus = async () => {
    attempts++;
    statusText.innerText = `Verifying... (${attempts}/${maxAttempts})`;

    try {
      const response = await fetch("https://api.digitalcart.space/api/verify-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order: orderId })
      });

      const result = await response.json();

      if (result.allowDownload) {
        // Order से productId लेते हैं
        const orderSnap = await getDoc(doc(db, "orders", orderId));
        if (orderSnap.exists()) {
          const orderData = orderSnap.data();
          const productId = orderData.productId;

          // Product load
          const productSnap = await getDoc(doc(db, "products", productId));
          if (productSnap.exists()) {
            const product = productSnap.data();

            statusText.innerText = "Payment successful! Your game is ready 🎮";
            downloadBtn.style.display = "block";
            downloadBtn.onclick = () => {
              window.location.href = product.fileUrl;
            };

            // PURCHASE EVENT FIRE
            if (typeof fbq === 'function') {
              fbq('track', 'Purchase', {
                value: product.price,
                currency: 'INR',
                content_type: 'product',
                content_ids: [productId]
              });
            }
          }
        }
      } else {
        if (attempts < maxAttempts) {
          setTimeout(checkStatus, delay);
        } else {
          statusText.innerText = "Payment verification timed out. Contact support.";
        }
      }
    } catch (err) {
      console.error(err);
      if (attempts < maxAttempts) {
        setTimeout(checkStatus, delay);
      } else {
        statusText.innerText = "Server error. Contact support.";
      }
    }
  };

  checkStatus();
});
</script>
