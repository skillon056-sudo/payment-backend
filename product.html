<meta charset="UTF-8">
<title>Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== TOP BAR ===== */
.product-top{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  background:#0a0a0a;
  border-bottom:1px solid #1f1f1f;
}
.product-top button{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}
.menu-box{
  position:relative;
}
.dropdown{
  position:absolute;
  right:0;
  top:40px;
  background:#111;
  border:1px solid #222;
  border-radius:12px;
  min-width:200px;
  display:none;
}
.dropdown a{
  display:block;
  padding:12px 14px;
  color:#fff;
  text-decoration:none;
}
.dropdown a:hover{background:#1a1a1a;}
.dropdown.show{display:block;}

/* ===== REVIEW UI ===== */
.review{
  border-bottom:1px solid #222;
  padding:10px 0;
}
.review b{display:block;margin-bottom:4px;}
#reviewForm textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#111;
  border:1px solid #222;
  color:#fff;
  margin-bottom:10px;
}

/* ===== TAGS ON PRODUCT PAGE ===== */
.product-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}

.tag {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.tag-hot {
  background: #ff4444;
  color: white;
  box-shadow: 0 0 15px #ff4444;
  animation: pulse-glow-red 2s infinite;
}

.tag-good {
  background: #00ff88;
  color: black;
  box-shadow: 0 0 15px #00ff88;
  animation: pulse-glow 2s infinite;
}

.tag-useful {
  background: #ffaa00;
  color: black;
  box-shadow: 0 0 15px #ffaa00;
  animation: pulse-glow 2s infinite;
}

@keyframes pulse-glow {
  0% { box-shadow: 0 0 15px currentColor; }
  50% { box-shadow: 0 0 25px currentColor, 0 0 35px currentColor; }
  100% { box-shadow: 0 0 15px currentColor; }
}

@keyframes pulse-glow-red {
  0% { box-shadow: 0 0 15px #ff4444; }
  50% { box-shadow: 0 0 30px #ff4444, 0 0 40px #ff0000; }
  100% { box-shadow: 0 0 15px #ff4444; }
}
</style>
</head>

<body>

<!-- ===== TOP BAR ===== -->
<header class="product-top">
  <button onclick="history.back()">←</button>
  <span>Product</span>
  <div class="menu-box">
    <button onclick="toggleMenu()">☰</button>
    <div class="dropdown" id="menu">
      <a href="index.html">🏠 Home</a>
      <a href="your-products.html">📦 Your Products</a>
      <a href="transaction-history.html">💳 Transactions</a>
      <a href="profile.html">👤 Profile</a>
    </div>
  </div>
</header>

<!-- ===== PRODUCT ===== -->
<div class="product-wrap">

  <div class="product-image">
    <img id="productImg">
  </div>

  <div class="product-info">
    <h1 id="productTitle">Loading...</h1>

    <!-- TAGS YAHAN DIKHENGI -->
    <div class="product-tags" id="productTags"></div>

    <div class="p-price" id="productPrice"></div>
    <p class="p-desc" id="productDesc"></p>

    <button id="buyBtn" class="buy-btn">BUY NOW</button>

    <!-- WHAT YOU GET -->
    <div class="inside-box">
      <h3>What you will get</h3>
      <ul id="insideList"></ul>
    </div>

    <!-- REVIEWS -->
    <div class="review-box">
      <h3>Reviews</h3>
      <div id="reviewList"></div>
      <p id="noReview" class="muted">No reviews yet</p>

      <button id="reviewBtn" class="buy-btn">WRITE A REVIEW</button>

      <div id="reviewForm" style="display:none;">
        <textarea id="reviewMsg" placeholder="Write your review"></textarea>
        <button id="submitReview" class="buy-btn">SUBMIT</button>
      </div>

      <p id="reviewStatus" class="muted"></p>
    </div>
  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script type="module">
import { db, auth } from "./firebase.js";
import {
  doc, getDoc,
  collection, query, where, getDocs, addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const params = new URLSearchParams(location.search);
const productId = params.get("id");
const orderId = params.get("order");

const buyBtn = document.getElementById("buyBtn");
const productTags = document.getElementById("productTags");

let PRODUCT, USER;

/* AUTH */
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href="login.html";
  USER = user;
  await loadProduct();
  await loadReviews();
  if (orderId) unlockDownload();
});

/* LOAD PRODUCT */
async function loadProduct(){
  const snap = await getDoc(doc(db,"products",productId));
  PRODUCT = snap.data();

  document.getElementById("productImg").src = PRODUCT.image;
  document.getElementById("productTitle").innerText = PRODUCT.title;
  document.getElementById("productPrice").innerText = "₹"+PRODUCT.price;
  document.getElementById("productDesc").innerText = PRODUCT.description || "";

  // TAGS GENERATE
  let tagsHTML = "";
  if (PRODUCT.isHotSelling) tagsHTML += `<span class="tag tag-hot">HOT SELLING</span>`;
  if (PRODUCT.isGood) tagsHTML += `<span class="tag tag-good">GOOD</span>`;
  if (PRODUCT.isUseful) tagsHTML += `<span class="tag tag-useful">USEFUL</span>`;
  productTags.innerHTML = tagsHTML;

  const insideList = document.getElementById("insideList");
  insideList.innerHTML="";
  if(Array.isArray(PRODUCT.inside)){
    PRODUCT.inside.forEach(i=>{
      insideList.innerHTML += `<li>${i}</li>`;
    });
  }
}

/* BUY */
async function buyNow(){
  buyBtn.innerText="Processing...";
  buyBtn.disabled=true;

  const res = await fetch(
    "https://payment-backend-kzcf.onrender.com/api/create-order",
    {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        productId,
        userId: USER.uid
      })
    }
  );

  const data = await res.json();
  if(data.status!=="success"){
    alert(data.message);
    resetBtn();
    return;
  }
  location.href = data.payment_url;
}

function unlockDownload(){
  buyBtn.innerText="DOWNLOAD";
  buyBtn.disabled=false;
  buyBtn.onclick=()=>location.href=PRODUCT.fileUrl;
}

function resetBtn(){
  buyBtn.innerText="BUY NOW";
  buyBtn.disabled=false;
}

buyBtn.addEventListener("click", buyNow);

/* LOAD REVIEWS */
async function loadReviews(){
  const q = query(collection(db,"reviews"),
    where("productId","==",productId)
  );
  const snap = await getDocs(q);

  const reviewList = document.getElementById("reviewList");
  reviewList.innerHTML="";
  if(snap.empty){
    document.getElementById("noReview").style.display="block";
    return;
  }
  document.getElementById("noReview").style.display="none";

  snap.forEach(d=>{
    const r=d.data();
    reviewList.innerHTML+=`
      <div class="review">
        <b>${r.name}</b>
        <p>${r.message}</p>
      </div>
    `;
  });
}

/* REVIEW LOGIC */
document.getElementById("reviewBtn").onclick = async ()=>{
  const q1 = query(collection(db,"orders"),
    where("userId","==",USER.uid),
    where("productId","==",productId),
    where("status","==","paid")
  );
  const orderSnap = await getDocs(q1);
  if(orderSnap.empty){
    document.getElementById("reviewStatus").innerText="❌ You have to buy product first";
    return;
  }

  const q2 = query(collection(db,"reviews"),
    where("userId","==",USER.uid),
    where("productId","==",productId)
  );
  const reviewSnap = await getDocs(q2);
  if(reviewSnap.size>=2){
    document.getElementById("reviewStatus").innerText="❌ Max 2 reviews allowed";
    return;
  }

  document.getElementById("reviewForm").style.display="block";
};

document.getElementById("submitReview").onclick = async ()=>{
  const msg = document.getElementById("reviewMsg").value.trim();
  if(!msg) return;

  await addDoc(collection(db,"reviews"),{
    productId,
    userId: USER.uid,
    name: USER.displayName || "User",
    message: msg,
    source:"user",
    createdAt:new Date()
  });

  document.getElementById("reviewForm").style.display="none";
  document.getElementById("reviewMsg").value="";
  document.getElementById("reviewStatus").innerText="✅ Review submitted";
  loadReviews();
};
</script>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("show");
}
</script>

</body>
