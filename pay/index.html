<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complete Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="title">Complete Payment</span>
  </div>

  <!-- CARD -->
  <div class="payment-card">

    <h2 class="heading">UPI Payment</h2>
    <p class="amount" id="amount">Loading...</p>

    <!-- QR -->
    <div class="qr-wrapper">
      <img id="qrImg" alt="UPI QR Code" />
    </div>

    <p class="hint">Scan the QR using any UPI app</p>

    <!-- UPI APPS -->
    <div class="upi-icons">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Google_Pay_%28GPay%29_Logo.svg" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/PhonePe_Logo.svg" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Paytm_Logo_%28standalone%29.svg" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/BHIM_UPI_Logo.svg" />
    </div>

    <!-- INTENT -->
    <button id="upiBtn" class="upi-btn">
      Pay with UPI App
    </button>

    <!-- STATUS -->
    <p class="status" id="status">Waiting for payment...</p>

  </div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
