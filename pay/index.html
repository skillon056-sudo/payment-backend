<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complete Payment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <h1 class="title">🎮 COMPLETE PAYMENT</h1>

  <div class="card">
    <p class="label">Order ID</p>
    <p class="value" id="orderId"></p>

    <p class="label">Amount</p>
    <p class="value">₹<span id="amount"></span></p>
  </div>

  <div class="card qr-card">
    <p class="label">Scan & Pay (UPI)</p>
    <img id="qrImage" alt="UPI QR Code" />
    <p class="hint">Use any UPI app (GPay / PhonePe / Paytm)</p>
  </div>

  <p id="status">Waiting for payment...</p>
</div>

<script src="app.js"></script>
</body>
</html>
