<!DOCTYPE html>
<html>
<head>
  <title>Secure Payment</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #0f1c3f, #020617);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }
    h1 {
      color: #38bdf8;
      margin: 20px 0;
      letter-spacing: 2px;
    }
    .box {
      max-width: 420px;
      margin: auto;
      background: #020617;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 0 30px #020617;
    }
    iframe {
      width: 100%;
      height: 520px;
      border: none;
      border-radius: 12px;
      background: white;
    }
  </style>
</head>
<body>

<h1>🎮 COMPLETE PAYMENT</h1>

<div class="box">
  <iframe id="payFrame"></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const paymentUrl = params.get("payment_url");

  if (!paymentUrl) {
    document.body.innerHTML = "<h2>Payment link missing</h2>";
  } else {
    document.getElementById("payFrame").src =
      decodeURIComponent(paymentUrl);
  }
</script>

</body>
</html>
