<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complete Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="pay-screen">
  <div class="header">
    <span class="brand">🎮 DIGITALCART</span>
    <span class="timer" id="timer">Link valid</span>
  </div>

  <!-- OPTION SELECT -->
  <div class="options">
    <div class="option active" id="qrOption">Pay by QR</div>
    <div class="option" id="appOption">Pay with App</div>
  </div>

  <!-- QR SECTION -->
  <div id="qrSection" class="section">
    <div class="qr-box">
      <img id="qrImg" alt="QR Code"/>
    </div>
    <p class="info">
      Scan QR using any UPI app to pay <b id="amountText">₹0</b>
    </p>
    <div class="apps">
      <span>GPay</span><span>PhonePe</span><span>Paytm</span><span>BHIM</span>
    </div>
    <p class="status" id="statusText">⏳ Waiting for payment…</p>
  </div>

  <!-- APP INTENT -->
  <div id="appSection" class="section hidden">
    <button class="pay-btn" id="payAppBtn">🚀 Pay with App</button>
    <p class="status">UPI apps will open automatically</p>
  </div>
</div>

<!-- SUCCESS / FAIL POPUP -->
<div class="popup hidden" id="popup">
  <div class="popup-box" id="popupBox">
    <h2 id="popupTitle"></h2>
    <p id="popupMsg"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
