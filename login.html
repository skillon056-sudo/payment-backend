<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#050505;
  font-family:Arial, sans-serif;
  color:white;
}
.box{
  width:360px;
  background:#0f0f0f;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 25px #00ffee55;
}
h2{text-align:center;color:#00ffee;}
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  border:1px solid #333;
  color:white;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.login{
  background:#00ffee;
  color:black;
}
.google{
  background:white;
  color:black;
  box-shadow:0 0 15px #4285f4;
}
small{
  display:block;
  margin-top:10px;
  text-align:center;
}
a{color:#00ffee;text-decoration:none;}
</style>
</head>

<body>

<div class="box">
  <h2>Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="login" id="loginBtn">LOGIN</button>
  <button class="google" id="googleLoginBtn">Login with Google</button>

  <small>New user? <a href="signup.html">Create account</a></small>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

document.getElementById("loginBtn").addEventListener("click", async () => {
  try{
    await signInWithEmailAndPassword(auth, email.value, password.value);
    location.href="index.html";
  }catch(err){
    alert(err.message);
    console.error(err);
  }
});

document.getElementById("googleLoginBtn").addEventListener("click", async () => {
  try{
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    location.href="index.html";
  }catch(err){
    alert(err.message);
    console.error(err);
  }
});
</script>

</body>
</html>
