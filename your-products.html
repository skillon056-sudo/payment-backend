<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Your Products</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:system-ui}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#111;border-bottom:1px solid #222;
}
.back-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.menu-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}

.menu{
  position:absolute;top:56px;right:16px;background:#161616;
  border:1px solid #2a2a2a;border-radius:10px;width:190px;display:none;
}
.menu a{
  display:block;padding:12px 14px;color:#ddd;text-decoration:none;
  border-bottom:1px solid #222;font-size:14px;
}
.menu a:hover{background:#222;color:#00ffc3}

.container{max-width:1100px;margin:24px auto;padding:0 14px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}
.card{
  background:#141414;border:1px solid #222;border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;
}
.card img{width:100%;height:170px;object-fit:cover}
.card .info{padding:14px;flex:1}
.card h3{margin:0;font-size:16px}
.card p{color:#aaa;font-size:14px;margin:6px 0}
.card button{
  width:100%;padding:10px;border:none;border-radius:10px;
  background:#00ffc3;color:#000;font-weight:600;cursor:pointer;
}
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  width: 60px;
  height: 60px;
  background: #25D366;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.whatsapp-float img {
  width: 32px;
  height: 32px;
}

@media (max-width: 600px) {
  .whatsapp-float {
    bottom: 16px;
    right: 16px;
    width: 55px;
    height: 55px;
  }
}

</style>
</head>

<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <strong>Your Products</strong>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</div>

<div id="menu" class="menu">
  <a href="index.html">🏠 Home</a>
  <a href="your-products.html">📦 Your Products</a>
  <a href="transaction-history.html">💳 Transactions</a>
  <a href="profile.html">👤 Profile</a>
</div>

<div class="container">
  <div id="grid" class="grid"></div>
</div>

<script>
function toggleMenu(){
  const m=document.getElementById("menu");
  m.style.display=m.style.display==="block"?"none":"block";
}
document.addEventListener("click",e=>{
  if(!e.target.classList.contains("menu-btn")){
    document.getElementById("menu").style.display="none";
  }
});
</script>

<script type="module">
import { auth, db } from "./firebase.js";
import { collection, query, where, getDocs, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const grid=document.getElementById("grid");

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="login.html";

  const q=query(
    collection(db,"orders"),
    where("userId","==",user.uid),
    where("status","==","paid")
  );

  const snap=await getDocs(q);
  if(snap.empty){
    grid.innerHTML="<p style='color:#777'>No products purchased yet.</p>";
    return;
  }

  for(const o of snap.docs){
    const d=o.data();
    const pSnap=await getDoc(doc(db,"products",d.productId));
    if(!pSnap.exists()) continue;
    const p=pSnap.data();

    grid.innerHTML+=`
      <div class="card">
        <img src="${p.image}">
        <div class="info">
          <h3>${p.title}</h3>
          <p>₹${p.price}</p>
          <button onclick="location.href='${p.fileUrl}'">Download</button>
        </div>
      </div>`;
  }
});
</script>
<a
  href="https://wa.me/919999999999?text=Hello%20Support"
  target="_blank"
  class="whatsapp-float"
>
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" />
</a>

</body>
</html>
