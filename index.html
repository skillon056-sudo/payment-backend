<script type="module">
import { db, auth } from "./firebase.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
});

let allProducts = [];
let banners = [];
let firstSectionRendered = false;

async function loadData() {
  const productsSnap = await getDocs(collection(db, "products"));
  allProducts = [];
  productsSnap.forEach(doc => {
    const p = doc.data();
    p.id = doc.id;
    allProducts.push(p);
  });

  const normalSnap = await getDocs(query(collection(db, "normalSections"), orderBy("order")));
  const container = document.getElementById("normalSectionsContainer");

  normalSnap.forEach(doc => {
    const data = doc.data();
    const sectionProducts = allProducts.filter(p => p.normalSectionId === doc.id);

    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";
    sectionDiv.innerHTML = `
      <div class="section-header">
        <div class="section-title">${data.title}</div>
        <div class="view-all" onclick="location.href='category.html?id=${doc.id}'">View all ></div>
      </div>
      <div class="videos" id="normal-${doc.id}"></div>
    `;
    container.appendChild(sectionDiv);

    renderProducts(`normal-${doc.id}`, sectionProducts);

    // Banner slider को पहली section के नीचे insert करो
    if (!firstSectionRendered) {
      const bannerSlider = document.getElementById("bannerSlider");
      container.appendChild(bannerSlider);
      bannerSlider.style.display = "block";
      firstSectionRendered = true;
    }
  });

  const bannersSnap = await getDocs(query(collection(db, "banners"), orderBy("order")));
  banners = [];
  bannersSnap.forEach(doc => {
    const b = doc.data();
    b.id = doc.id;
    banners.push(b);
  });

  renderBanners();
}

function renderBanners() {
  const slidesContainer = document.getElementById("bannerSlides");
  const dotsContainer = document.getElementById("bannerDots");

  if (banners.length === 0) {
    return;
  }

  slidesContainer.innerHTML = banners.map((b, i) => `
    <div class="banner-slide">
      <img src="${b.image}" alt="Banner">
    </div>
  `).join("");

  dotsContainer.innerHTML = banners.map((_, i) => `
    <span class="banner-dot ${i === 0 ? 'active' : ''}" onclick="currentSlide(${i})"></span>
  `).join("");

  let currentIndex = 0;
  const slides = document.querySelectorAll(".banner-slide");
  const dots = document.querySelectorAll(".banner-dot");

  window.currentSlide = (n) => {
    slides.forEach(s => s.style.display = "none");
    dots.forEach(d => d.classList.remove("active"));
    slides[n].style.display = "block";
    dots[n].classList.add("active");
  };

  document.querySelector(".banner-next").onclick = () => {
    currentIndex = (currentIndex + 1) % slides.length;
    window.currentSlide(currentIndex);
  };

  document.querySelector(".banner-prev").onclick = () => {
    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
    window.currentSlide(currentIndex);
  };

  setInterval(() => {
    document.querySelector(".banner-next").click();
  }, 5000);

  window.currentSlide(0);
}

function renderProducts(containerId, products) {
  const container = document.getElementById(containerId);
  if (!container) return;

  if (products.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#777;font-size:16px;">No products in this section yet</div>';
    return;
  }

  products.sort((a, b) => {
    if (a.isHotSelling && !b.isHotSelling) return -1;
    if (!a.isHotSelling && b.isHotSelling) return 1;
    return 0;
  });

  container.innerHTML = products.map(p => {
    let tagsHTML = "";
    if (p.isHotSelling) tagsHTML += `<span class="tag tag-hot">HOT SELLING</span>`;
    if (p.isGood) tagsHTML += `<span class="tag tag-good">GOOD</span>`;
    if (p.isUseful) tagsHTML += `<span class="tag tag-useful">USEFUL</span>`;

    return `
      <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
        <img src="${p.image}" alt="${p.title}">
        <div class="product-info">
          <div class="product-title">${p.title}</div>
          <div class="product-tags">${tagsHTML}</div>
          <div class="product-price">₹${p.price}</div>
        </div>
      </div>
    `;
  }).join("");
}

loadData();
</script>
