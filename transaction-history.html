<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Transactions</title>
<link rel="stylesheet" href="style.css">
</head>
<script>
function toggleMenu(){
  const menu = document.getElementById("menuBox");
  if(menu){
    menu.classList.toggle("show");
  }
}
</script>
<body>

<header class="main-top-bar">
  <div class="logo-box">
    <img src="logo.png" class="site-logo">
    <span class="logo-text">DIGITAL WORLD</span>
  </div>

  <div class="menu">
    <button class="menu-icon" onclick="toggleMenu()">☰</button>

    <div class="dropdown" id="menuBox">
      <a href="index.html">🏠 Home</a>
      <a href="profile.html">👤 Profile</a>
      <a href="your-products.html">📦 Your Products</a>
      <a href="transaction-history.html">💳 Transactions</a>
      <a href="#" id="logoutBtn">🚪 Logout</a>
    </div>
  </div>
</header>

<div class="page-center">
  <div class="section-title">Payment History</div>
  <div class="tx-box" id="txList"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, query, where, orderBy, getDocs } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

onAuthStateChanged(auth, async user=>{
  if(!user){ location.href="login.html"; return; }

  const q = query(
    collection(db,"orders"),
    where("userId","==",user.uid),
    orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);

  if(snap.empty){
    txList.innerHTML = "<p>No transactions found</p>";
    return;
  }

  snap.forEach(d=>{
    const t = d.data();
    txList.innerHTML += `
      <div class="tx-row">
        <div>
          <b>${t.productTitle}</b><br>
          <small>${new Date(t.createdAt).toLocaleString()}</small>
        </div>
        <div class="tx-right">
          ₹${t.price}<br>
          <span class="tx-status">${t.status}</span>
        </div>
      </div>
    `;
  });
});
</script>

</body>
</html>
