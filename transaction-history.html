<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Transaction History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:system-ui}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#111;border-bottom:1px solid #222;
}
.back-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.menu-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}

.menu{
  position:absolute;top:56px;right:16px;background:#161616;
  border:1px solid #2a2a2a;border-radius:10px;width:190px;display:none;
}
.menu a{
  display:block;padding:12px 14px;color:#ddd;text-decoration:none;
  border-bottom:1px solid #222;font-size:14px;
}
.menu a:hover{background:#222;color:#00ffc3}

.container{max-width:1200px;margin:24px auto;padding:0 14px}

/* DESKTOP TABLE */
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #222;font-size:14px}
th{color:#aaa;text-align:left}

/* STATUS */
.paid{color:#00ffc3}
.pending{color:#ffb000}

/* MOBILE CARDS */
.cards{display:none}
.card{
  background:#141414;border:1px solid #222;border-radius:14px;
  padding:14px;margin-bottom:14px;
}
.card-row{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.card-row span{color:#aaa}

/* RESPONSIVE */
@media(max-width:768px){
  table{display:none}
  .cards{display:block}
}
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  width: 60px;
  height: 60px;
  background: #25D366;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.whatsapp-float img {
  width: 32px;
  height: 32px;
}

@media (max-width: 600px) {
  .whatsapp-float {
    bottom: 16px;
    right: 16px;
    width: 55px;
    height: 55px;
  }
}

</style>
</head>

<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <strong>Transactions</strong>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</div>

<div id="menu" class="menu">
  <a href="index.html">🏠 Home</a>
  <a href="your-products.html">📦 Your Products</a>
  <a href="transaction-history.html">💳 Transactions</a>
  <a href="profile.html">👤 Profile</a>
</div>

<div class="container">

<!-- DESKTOP -->
<table>
<thead>
<tr>
  <th>Order ID</th>
  <th>Product</th>
  <th>Amount</th>
  <th>Status</th>
  <th>Date</th>
</tr>
</thead>
<tbody id="tableRows"></tbody>
</table>

<!-- MOBILE -->
<div id="cards" class="cards"></div>

</div>

<script>
function toggleMenu(){
  const m=document.getElementById("menu");
  m.style.display=m.style.display==="block"?"none":"block";
}
document.addEventListener("click",e=>{
  if(!e.target.classList.contains("menu-btn")){
    document.getElementById("menu").style.display="none";
  }
});
</script>

<script type="module">
import { auth, db } from "./firebase.js";
import { collection, query, where, orderBy, getDocs, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const table=document.getElementById("tableRows");
const cards=document.getElementById("cards");

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="login.html";

  const q=query(
    collection(db,"orders"),
    where("userId","==",user.uid),
    orderBy("createdAt","desc")
  );

  const snap=await getDocs(q);
  if(snap.empty){
    table.innerHTML=`<tr><td colspan="5" style="color:#777">No transactions</td></tr>`;
    return;
  }

  for(const d of snap.docs){
    const o=d.data();
    const pSnap=await getDoc(doc(db,"products",o.productId));
    const title=pSnap.exists()?pSnap.data().title:"Deleted";

    const date=new Date(o.createdAt.seconds*1000).toLocaleString();

    table.innerHTML+=`
      <tr>
        <td>${o.orderId}</td>
        <td>${title}</td>
        <td>₹${o.amount}</td>
        <td class="${o.status}">${o.status.toUpperCase()}</td>
        <td>${date}</td>
      </tr>`;

    cards.innerHTML+=`
      <div class="card">
        <div class="card-row"><span>Order</span><b>${o.orderId}</b></div>
        <div class="card-row"><span>Product</span><b>${title}</b></div>
        <div class="card-row"><span>Amount</span><b>₹${o.amount}</b></div>
        <div class="card-row"><span>Status</span>
          <b class="${o.status}">${o.status.toUpperCase()}</b>
        </div>
        <div class="card-row"><span>Date</span><b>${date}</b></div>
      </div>`;
  }
});
</script>
<a
  href="https://wa.me/919999999999?text=Hello%20Support"
  target="_blank"
  class="whatsapp-float"
>
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" />
</a>

</body>
</html>
